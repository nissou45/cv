<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nissrine Bussenet — Fullstack Developer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#FAF8F4;--beige:#EDE5D8;--sand:#D4C4B0;
  --lav:#C9BBE0;--lavlight:#F0EBF8;--lavmid:#9B87C2;--lavdark:#6B5B9C;
  --brown:#8B7355;--dark:#2C2416;--muted:#9B8B7A;--white:#fff;
  --info:#5C8374;--infobg:#EAF3F0;
}
body{font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#F0EBF8 0%,#FAF8F4 50%,#EDE5D8 100%);min-height:100vh;display:flex;justify-content:center;padding:24px}
.app{max-width:900px;width:100%;background:var(--white);border-radius:24px;overflow:hidden;box-shadow:0 24px 80px rgba(107,91,156,.15),0 8px 24px rgba(44,36,22,.08)}

/* ── HERO ── */
.hero{background:var(--white);padding:30px 40px 0;position:relative;overflow:hidden}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2}
.hero-name h1{font-size:27px;font-weight:700;color:var(--dark);letter-spacing:-.5px}
.hero-name p{font-size:12px;color:var(--lavmid);margin-top:4px;font-weight:600;letter-spacing:.5px}
.hero-contact{text-align:right;font-size:11px;color:var(--muted);line-height:2}
.hero-contact a{color:var(--muted);text-decoration:none}.hero-contact a:hover{color:var(--lavdark)}
.hero-center{display:flex;justify-content:center;margin-top:10px;position:relative;z-index:2}


.photo-card{
  width:190px;height:190px;border-radius:50%;overflow:hidden;
  border:4px solid var(--lav);
  box-shadow:
    0 0 0 8px rgba(201,187,224,.2),
    0 0 0 16px rgba(201,187,224,.08),
    0 20px 50px rgba(107,91,156,.25),
    0 8px 20px rgba(107,91,156,.15);
  position:relative;
  transition:.35s ease;
}
.photo-card:hover{transform:scale(1.04);box-shadow:0 0 0 10px rgba(201,187,224,.25),0 0 0 20px rgba(201,187,224,.1),0 28px 60px rgba(107,91,156,.3)}
.photo-card img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}

.status-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;background:var(--infobg);color:var(--info);border:1px solid rgba(92,131,116,.25);padding:4px 14px;border-radius:20px;font-weight:600;margin-top:12px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--info);animation:p 2s infinite}
@keyframes p{0%,100%{box-shadow:0 0 0 0 rgba(92,131,116,.4)}50%{box-shadow:0 0 0 5px rgba(92,131,116,0)}}
.hero-bottom{display:flex;flex-direction:column;align-items:center;padding-bottom:28px;margin-top:10px}
.bot{position:absolute;top:8px;opacity:.38;z-index:1}
.bot.l{left:-6px}.bot.r{right:-6px;transform:scaleX(-1)}


/* ── BAND ── */
.band{background:linear-gradient(135deg,var(--lavlight) 0%,var(--beige) 100%);padding:26px 40px 24px;border-top:1px solid rgba(201,187,224,.3)}
.band-grid{display:grid;grid-template-columns:1fr 1fr;gap:44px}
.band-title{font-size:17px;font-weight:700;color:var(--dark);margin-bottom:14px}
.profil-text{font-size:12px;color:var(--muted);line-height:1.85;font-style:italic}
.skills-row{display:flex;gap:11px;flex-wrap:wrap}
.skill-circle{display:flex;flex-direction:column;align-items:center;gap:5px}
.scircle{width:50px;height:50px;border-radius:50%;background:var(--white);border:2px solid var(--lav);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--lavdark);box-shadow:0 4px 12px rgba(107,91,156,.15)}
.scircle.grow{border-color:var(--info);color:var(--info);background:var(--infobg)}
.skill-circle span{font-size:8.5px;color:var(--muted);text-align:center;max-width:55px;line-height:1.3}

/* ── TABS ── */
.tabs{display:flex;padding:0 24px;border-bottom:1.5px solid var(--lavlight);background:var(--white);overflow-x:auto}
.tab{padding:13px 13px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;transition:.15s;white-space:nowrap;user-select:none}
.tab:hover{color:var(--dark)}.tab.on{color:var(--lavdark);border-bottom-color:var(--lavmid)}

/* ── PANELS ── */
.panels{padding:28px 40px;background:var(--white)}
.panel{animation:fi .22s ease}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.ptitle{font-size:18px;font-weight:700;color:var(--dark);margin-bottom:18px;display:flex;align-items:center;gap:14px}
.ptitle::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--lav),transparent)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:40px}

/* Timeline */
.titem{display:flex;gap:0;margin-bottom:20px}
.tdate-box{width:85px;flex-shrink:0;padding-top:1px}
.tdate-pill{font-size:9px;background:var(--lavlight);color:var(--lavdark);padding:3px 9px;border-radius:20px;display:inline-block;font-weight:700;white-space:nowrap;border:1px solid var(--lav)}
.tline-col{display:flex;flex-direction:column;align-items:center;width:24px;flex-shrink:0}
.tdot{width:10px;height:10px;border-radius:50%;background:var(--lavmid);margin-top:3px;box-shadow:0 0 0 3px rgba(155,135,194,.2)}
.tvline{flex:1;width:1.5px;background:var(--lavlight);margin-top:4px;min-height:20px}
.tbody{flex:1;padding-left:10px}
.tposte{font-size:11.5px;font-weight:700;color:var(--dark);text-transform:uppercase;letter-spacing:.4px}
.torg{font-size:10.5px;color:var(--lavmid);margin-top:2px;font-weight:600}
.tbull{list-style:none;margin-top:7px}
.tbull li{font-size:11px;color:var(--muted);padding:2px 0 2px 13px;position:relative;line-height:1.6}
.tbull li::before{content:'▸';color:var(--lavmid);position:absolute;left:0;font-size:9px;top:4px}

/* Projects */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.pcard{background:var(--cream);border-radius:16px;padding:17px;border:1.5px solid var(--lavlight);transition:.25s}
.pcard:hover{border-color:var(--lav);transform:translateY(-3px);box-shadow:0 12px 30px rgba(107,91,156,.12)}
.pcard-emoji{font-size:20px;margin-bottom:9px}
.pcard-name{font-size:12px;font-weight:700;color:var(--dark);margin-bottom:5px;line-height:1.3}
.pcard-desc{font-size:10.5px;color:var(--muted);line-height:1.6;margin-bottom:10px}
.pcard-tech{display:flex;flex-wrap:wrap;gap:4px}
.ptag{font-size:9px;padding:3px 9px;background:var(--lavlight);color:var(--lavdark);border-radius:6px;font-weight:600}

/* Skills */
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.scard{background:var(--cream);border-radius:14px;padding:14px 16px;border:1.5px solid var(--lavlight)}
.scat{font-size:8.5px;font-weight:700;color:var(--lavdark);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px}
.spills{display:flex;flex-wrap:wrap;gap:5px}
.spill{font-size:10px;padding:4px 11px;background:var(--white);color:var(--dark);border-radius:7px;font-weight:500;border:1px solid var(--lav)}
.spill.grow{background:var(--infobg);color:var(--info);border-color:rgba(92,131,116,.3);font-weight:700}

/* Pills */
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.pill{font-size:11.5px;padding:7px 18px;background:var(--lavlight);color:var(--lavdark);border-radius:20px;font-weight:600;border:1px solid var(--lav)}

/* RDV */
.rdv-wrap{background:linear-gradient(135deg,var(--lavlight),var(--beige));border-radius:18px;padding:28px;border:1.5px solid var(--lav);margin-bottom:20px}
.rdv-title{font-size:16px;font-weight:700;color:var(--dark);margin-bottom:6px}
.rdv-sub{font-size:12px;color:var(--muted);margin-bottom:20px;line-height:1.6}
.rdv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.rdv-field{display:flex;flex-direction:column;gap:5px}
.rdv-field label{font-size:9.5px;font-weight:700;color:var(--lavdark);letter-spacing:.5px;text-transform:uppercase}
.rdv-input{border:1.5px solid var(--lav);border-radius:10px;padding:10px 13px;font-size:12px;font-family:inherit;outline:none;background:var(--white);color:var(--dark);transition:.2s}
.rdv-input:focus{border-color:var(--lavmid);box-shadow:0 0 0 3px rgba(155,135,194,.12)}
.rdv-select{border:1.5px solid var(--lav);border-radius:10px;padding:10px 13px;font-size:12px;font-family:inherit;outline:none;background:var(--white);color:var(--dark);appearance:none;cursor:pointer}
.rdv-textarea{border:1.5px solid var(--lav);border-radius:10px;padding:10px 13px;font-size:12px;font-family:inherit;outline:none;background:var(--white);color:var(--dark);resize:none;width:100%;margin-bottom:14px;min-height:80px;transition:.2s}
.rdv-textarea:focus{border-color:var(--lavmid);box-shadow:0 0 0 3px rgba(155,135,194,.12)}
.rdv-btn{background:var(--lavdark);color:var(--white);border:none;border-radius:12px;padding:12px 28px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.2s;width:100%}
.rdv-btn:hover{background:var(--lavmid)}.rdv-btn:disabled{opacity:.5;cursor:not-allowed}
.rdv-success{background:var(--infobg);color:var(--info);border:1px solid rgba(92,131,116,.3);border-radius:12px;padding:14px 18px;font-size:12px;font-weight:600;text-align:center;margin-top:12px}

/* Contact */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ccard{background:var(--cream);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;border:1.5px solid var(--lavlight)}
.ccico{width:34px;height:34px;border-radius:10px;background:var(--lavlight);border:1px solid var(--lav);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.cclabel{font-size:8px;color:var(--muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.ccval{font-size:11.5px;font-weight:600;color:var(--dark);word-break:break-all}
.ccval a{color:var(--dark);text-decoration:none}.ccval a:hover{color:var(--lavdark);text-decoration:underline}

/* Chat */
.chat-wrap{display:flex;flex-direction:column;height:430px}
.chat-intro{background:var(--lavlight);border:1px solid rgba(201,187,224,.5);border-radius:14px;padding:13px 16px;margin-bottom:14px;font-size:12px;color:var(--muted);line-height:1.6}
.chat-intro strong{color:var(--lavdark)}
.suggs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.sug{font-size:10.5px;padding:5px 13px;background:var(--cream);border:1.5px solid var(--lavlight);border-radius:20px;cursor:pointer;color:var(--muted);transition:.2s}
.sug:hover{border-color:var(--lav);color:var(--lavdark)}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 0;margin-bottom:14px}
.msg{max-width:82%;padding:11px 15px;border-radius:14px;font-size:12px;line-height:1.65;animation:fi .2s ease}
.msg.user{align-self:flex-end;background:var(--lavdark);color:#f0ebf8;border-radius:14px 14px 4px 14px}
.msg.ai{align-self:flex-start;background:var(--cream);color:var(--dark);border:1.5px solid var(--lavlight);border-radius:14px 14px 14px 4px}
.msg.typing{color:var(--muted);font-style:italic}
.chat-row{display:flex;gap:8px}
.chat-input{flex:1;border:1.5px solid var(--lav);border-radius:10px;padding:10px 14px;font-size:12px;font-family:inherit;outline:none;transition:.2s;background:var(--cream);color:var(--dark)}
.chat-input:focus{border-color:var(--lavmid);background:var(--white)}
.send-btn{background:var(--lavdark);color:var(--white);border:none;border-radius:10px;padding:10px 18px;cursor:pointer;font-size:14px;font-weight:700;transition:.2s}
.send-btn:hover{background:var(--lavmid)}.send-btn:disabled{opacity:.35;cursor:not-allowed}
</style>
</head>

function RdvPanel() {
  const [form,setForm] = React.useState({nom:'',email:'',motif:'Recrutement CDI',date:'',msg:''});
  const [sent,setSent] = React.useState(false);
  const [loading,setLoading] = React.useState(false);
  const set = k => e => setForm(f=>({...f,[k]:e.target.value}));
  const submit = async() => {
    if(!form.nom||!form.email) return;
    setLoading(true);
    await new Promise(r=>setTimeout(r,1000));
    setSent(true);
    setLoading(false);
  };
  return(
    <div>
      <div className="rdv-wrap">
        <div className="rdv-title">📅 Prendre rendez-vous</div>
        <div className="rdv-sub">Vous souhaitez discuter d'une opportunité ou d'un projet ? Envoyez-moi une demande et je vous répondrai sous 24h !</div>
        {!sent ? (
          <>
            <div className="rdv-grid">
              <div className="rdv-field"><label>Votre nom</label><input className="rdv-input" placeholder="Jean Dupont" value={form.nom} onChange={set('nom')}/></div>
              <div className="rdv-field"><label>Votre email</label><input className="rdv-input" type="email" placeholder="jean@example.com" value={form.email} onChange={set('email')}/></div>
              <div className="rdv-field"><label>Motif</label>
                <select className="rdv-select" value={form.motif} onChange={set('motif')}>
                  <option>Recrutement CDI</option><option>Recrutement CDD</option>
                  <option>Mission Freelance</option><option>Collaboration projet</option><option>Autre</option>
                </select>
              </div>
              <div className="rdv-field"><label>Date souhaitée</label><input className="rdv-input" type="date" value={form.date} onChange={set('date')}/></div>
            </div>
            <textarea className="rdv-textarea" placeholder="Décrivez votre projet ou opportunité…" value={form.msg} onChange={set('msg')}/>
            <button className="rdv-btn" onClick={submit} disabled={loading||!form.nom||!form.email}>{loading?"Envoi en cours…":"Envoyer ma demande ✨"}</button>
          </>
        ):(
          <div className="rdv-success">🎉 Demande envoyée ! Nissrine vous contactera sous 24h.</div>
        )}
      </div>
    </div>
  );
}

function ChatPanel() {
  const [msgs,setMsgs] = React.useState([{role:'ai',text:"Bonjour ! Je suis l'assistante IA de Nissrine. Posez-moi n'importe quelle question sur son profil, ses projets ou ses compétences fullstack 😊"}]);
  const [input,setInput] = React.useState('');
  const [loading,setLoading] = React.useState(false);
  const ref = React.useRef();
  React.useEffect(()=>{ref.current?.scrollIntoView({behavior:'smooth'})},[msgs]);
  const send = async(text)=>{
    const q=(text||input).trim();
    if(!q||loading) return;
    setInput('');
    const next=[...msgs,{role:'user',text:q}];
    setMsgs(next);
    setLoading(true);
    try{
      const history=next.map(m=>({role:m.role==='ai'?'assistant':'user',content:m.text}));
      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:400,system:SYSTEM_PROMPT,messages:history})
      });
      const data=await res.json();
      setMsgs(m=>[...m,{role:'ai',text:data?.content?.[0]?.text||"Je n'ai pas pu répondre, réessayez !"}]);
    }catch{
      setMsgs(m=>[...m,{role:'ai',text:"Erreur de connexion, réessayez dans un moment !"}]);
    }
    setLoading(false);
  };
  return(
    <div className="chat-wrap">
      <div className="chat-intro"><strong>🤖 Assistante IA de Nissrine</strong><br/>Posez-moi une question sur son parcours fullstack, ses projets, ses compétences…</div>
      <div className="suggs">{SUGGESTIONS.map((s,i)=><div key={i} className="sug" onClick={()=>send(s)}>{s}</div>)}</div>
      <div className="msgs">
        {msgs.map((m,i)=><div key={i} className={`msg ${m.role}`}>{m.text}</div>)}
        {loading&&<div className="msg ai typing">En train de répondre…</div>}
        <div ref={ref}/>
      </div>
      <div className="chat-row">
        <input className="chat-input" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} placeholder="Votre question…" disabled={loading}/>
        <button className="send-btn" onClick={()=>send()} disabled={loading||!input.trim()}>↗</button>
      </div>
    </div>
  );
}

      <div className="tline-col"><div className="tdot"/><div className="tvline"/></div>

        <ul className="tbull">{item.bullets.map((b,j)=><li key={j}>{b}</li>)}</ul>
      </div>
    </div>
  ));
}
